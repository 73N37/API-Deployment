name: Mirror
on:
  push:
    paths:
      - src/main/java/dat/TestPackage/TestData.java
jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Gist with file contents
        uses: actions/github-script@v7
        env:
          GIST_ID:    ${{ inputs.gist_id != '' && inputs.gist_id || vars.GIST_ID }}
          FILE_PATH:  src/main/java/dat/TestPackage/TestData.java
          GIST_FILENAME: TestData.java
        with:
          github-token: ${{ secrets.GIST.TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(process.env.FILE_PATH, 'utf8');
            await github.request('PATCH /gists/{gist_id}', {
              gist_id: process.env.GIST_ID,
              files: { [process.env.GIST_FILENAME]: { content } }
            });